# KimsWeb Common Configuration
spring.application.name=kimsweb
spring.application.version=1.0.0

# Default Active Profile
spring.profiles.active=local

# Security Configuration
spring.main.allow-bean-definition-overriding=true

# MyBatis Configuration (If needed in future)
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=kr.co.kalpa.kimsweb.domain

# JPA Common Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File Upload / Base Directory (to be overridden in env profiles)
kimsweb.base-dir=${user.home}/kimsweb-data
